<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censys Port Lookup</title>
</head>
<body>
    <h1>Censys Open Ports Lookup</h1>
    <label for="ip">Enter IP Address:</label>
    <input type="text" id="ip" placeholder="Enter IP Address">
    <button onclick="fetchCensysData()">Search</button>
    <pre id="results"></pre>

    <script>
        async function fetchCensysData() {
            const ip = document.getElementById("ip").value;
            const url = `https://search.censys.io/hosts/${ip}/data/json`;

            if (!ip) {
                alert("Please enter a valid IP address!");
                return;
            }

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Error: ${response.statusText}`);
                }

                const data = await response.json();
                const openPorts = data.services.map(service => ({
                    port: service.port,
                    protocol: service.transport_protocol
                }));

                document.getElementById("results").textContent = JSON.stringify(openPorts, null, 2);
            } catch (error) {
                document.getElementById("results").textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
